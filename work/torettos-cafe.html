<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toretto's Cafe — Christopher Nuñez</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="project-page">
  <a class="back-link" href="../index.html#work">&larr; Back to Work</a>

  <header class="project-header">
    <div>
      <h1 class="project-title">Toretto's Cafe</h1>
      <hr class="project-rule">
      <p class="project-meta">Branding, Environmental Design. 2024</p>
    </div>
    <div class="project-desc">
      <p>Toretto's Cafe, created in collaboration with Kenneth Hankish and Oliver Larsen, is a museum experience honoring the legacy of the Fast and Furious franchise. On display are cars used throughout the movies.</p>
    </div>
  </header>

  <div class="project-images">
    <div class="project-gallery">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/EntranceWall.png" alt="Museum Entrance" loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/HakosukaTimeline.png" alt="Museum Timeline" loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/SkylineWall1.png" alt="Blue Print of Nissian Skyline " loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/SkylineWall2.png" alt="Wall Graphics of Nissian Skyline " loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/SkylineWallFront.png" alt="Nissian Skyline on display " loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/exhibit_renders/SupraZone.png" alt="Display of Supra " loading="lazy">
    </div>

    <h2 class="project-section-title">Supporting Graphics</h2>
    <div class="project-gallery">
      <img class="project-image" src="../assets/images/projects/torettos/Source_wall/EntranceSource.png" alt="Entrance Wall" loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/Source_wall/SupraWheel_Source.png" alt="Supra wall graphic" loading="lazy">
      <img class="project-image" src="../assets/images/projects/torettos/Source_wall/PlacardSource1.png" alt="Placard wall graphic" loading="lazy">
    </div>
  </div>
</div>
<script src="../js/lightbox.js"></script>
